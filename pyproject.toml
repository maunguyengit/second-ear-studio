[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-ear-studio"
version = "0.1.0"
description = "A local recording-to-transcript studio with source playback and subtitle export."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "faster-whisper>=1.2,<2", "truststore>=0.10,<1"]

[project.scripts]
second-ear = "second_ear.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
desktop = ["pyinstaller>=6.20,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
second_ear = ["web/*", "sample/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["inference: runs the real local speech recognition model"]
